# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: cnh.ab.activebilling
type: application
framework:
  name: SAPUI5
  version: 1.140.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - path: /http
            url: https://int-cert01.it-cpi026-rt.cfapps.eu10-002.hana.ondemand.com
            destination: ITS_DEST
            authenticationType: OAuth2ClientCredentials

          - path: /odata/v4/catalg
            destination: EINV_CAP_BackEnd_SRV
